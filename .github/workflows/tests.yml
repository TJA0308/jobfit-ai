name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run lexical evaluations
        run: |
          python scripts/evaluate.py --compare --json-output /tmp/jobfit-development.json
          python scripts/evaluate_evidence.py --json-output /tmp/jobfit-evidence.json

      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: lexical-evaluation
          path: /tmp/jobfit-*.json
