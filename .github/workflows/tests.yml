name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: components/jobfit-evidence/jobfit_evidence/frontend/package-lock.json

      - name: Verify evidence component
        working-directory: components/jobfit-evidence/jobfit_evidence/frontend
        run: |
          npm ci
          npm test
          npm run build
          git diff --exit-code -- build

      - name: Verify packaged assets
        run: python scripts/verify_component.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run lexical evaluations
        run: |
          python scripts/evaluate.py --compare --json-output /tmp/jobfit-development.json
          python scripts/evaluate_evidence.py --json-output /tmp/jobfit-evidence.json

      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: lexical-evaluation
          path: /tmp/jobfit-*.json
