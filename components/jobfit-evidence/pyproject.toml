[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfit-evidence"
version = "0.0.1"
description = "Browser-local requirement and resume evidence workspace"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "JobFit AI contributors" }]
dependencies = ["streamlit >= 1.66, < 2"]

[tool.setuptools.packages.find]
include = ["jobfit_evidence*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
jobfit_evidence = ["frontend/build/**/*", "pyproject.toml"]
