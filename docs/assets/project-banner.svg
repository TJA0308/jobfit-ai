<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">JobFit AI — from role language to explainable alignment</title>
  <desc id="desc">PDF, DOCX and TXT inputs pass through a Python analysis pipeline with exact resume evidence for job requirements. Wording alignment combines 60 percent text similarity and 40 percent keyword coverage. Document structure is separate. No API key is needed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1826"/><stop offset="1" stop-color="#102d31"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a7d9d0" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="24" fill="url(#grid)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="48" y="42" width="206" height="29" rx="14" fill="#123b39" stroke="#2d6158"/>
    <circle cx="65" cy="56" r="4" fill="#78e9b5"/>
    <text x="78" y="61" fill="#a1eccb" font-size="12" font-weight="700" letter-spacing="1.3">EXPLAINABLE NLP</text>
    <text x="46" y="157" fill="#f0f6fc" font-size="55" font-weight="750" letter-spacing="-1.5">See how <tspan fill="#78e9b5">resumes align.</tspan></text>
    <text x="49" y="211" fill="#e0edf1" font-size="27" font-weight="600">Every score should have a reason.</text>
    <text x="49" y="252" fill="#a7bac7" font-size="18">Compare resume language with a role.</text>
    <text x="49" y="279" fill="#a7bac7" font-size="18">Inspect requirements and exact resume evidence.</text>
    <g font-family="Consolas, monospace" font-size="13" fill="#cee2e6">
      <rect x="49" y="320" width="82" height="33" rx="7" fill="#172f3b" stroke="#304652"/><text x="67" y="342">Python</text>
      <rect x="141" y="320" width="105" height="33" rx="7" fill="#172f3b" stroke="#304652"/><text x="155" y="342">Streamlit</text>
      <rect x="256" y="320" width="90" height="33" rx="7" fill="#172f3b" stroke="#304652"/><text x="271" y="342">FastAPI</text>
      <rect x="356" y="320" width="86" height="33" rx="7" fill="#172f3b" stroke="#304652"/><text x="373" y="342">TF-IDF</text>
    </g>
    <text x="49" y="405" fill="#88abae" font-size="14">No API key needed  /  Session-local results  /  Tested core</text>
    <rect x="619" y="43" width="532" height="369" rx="14" fill="#0b1521" stroke="#35505b"/>
    <path d="M633 43H1137Q1151 43 1151 57V85H619V57Q619 43 633 43" fill="#182733"/>
    <circle cx="639" cy="64" r="4" fill="#da7d81"/><circle cx="654" cy="64" r="4" fill="#d8b870"/><circle cx="669" cy="64" r="4" fill="#79c99e"/>
    <text x="699" y="69" fill="#adc2ce" font-size="13" font-family="Consolas, monospace">jobfit / analysis pipeline</text>
    <g font-family="Consolas, monospace" font-size="15">
      <text x="646" y="123" fill="#78e9b5">$ analyze resume --against role</text>
      <text x="646" y="162" fill="#718c9d">01</text><text x="681" y="162" fill="#d9e7ee">extract_text(pdf | docx | txt)</text>
      <text x="646" y="194" fill="#718c9d">02</text><text x="681" y="194" fill="#d9e7ee">score_and_explain(text, role)</text>
      <text x="646" y="226" fill="#718c9d">03</text><text x="681" y="226" fill="#d9e7ee">retrieve_exact_evidence()</text>
    </g>
    <path d="M646 249H1124" stroke="#283c4a"/>
    <text x="646" y="278" fill="#9eb5c3" font-size="11" font-weight="700" letter-spacing="2">ALIGNMENT COMPOSITION</text>
    <rect x="646" y="296" width="284" height="12" rx="4" fill="#78e9b5"/>
    <rect x="935" y="296" width="189" height="12" rx="4" fill="#79baff"/>
    <text x="646" y="337" fill="#78e9b5" font-size="22" font-weight="700">60%</text><text x="646" y="357" fill="#a7bac7" font-size="12">Text similarity</text>
    <text x="935" y="337" fill="#79baff" font-size="22" font-weight="700">40%</text><text x="935" y="357" fill="#a7bac7" font-size="12">Keyword coverage</text>
    <text x="646" y="391" fill="#788f9f" font-size="12">Heuristic alignment. Not a hiring probability.</text>
  </g>
</svg>
